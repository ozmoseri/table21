# Render Blueprint for a free test server (docs/DEPLOY.md).
# One web service (single instance: the room authority lives in the process) plus one free Postgres so sessions,
# wallets and rooms survive restarts and spin-downs during the test period. Free Postgres expires 30 days after
# creation; see docs/DEPLOY.md for what to do then.
services:
  - type: web
    name: table21
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 --filter @table21/web build
    startCommand: cd apps/server && node --import tsx src/main.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: T21_DEPLOYMENT
        value: online
      - key: T21_DATA_DIR
        value: /tmp/table21-data
      # Pilot card for the operator (Settings): free database end date, quotas, one-tap backup.
      - key: T21_PILOT_PLAN
        value: render-free
      # Optional: the database creation date shown in the Render dashboard (ISO, e.g. 2026-11-02). Without it the
      # app uses the first time it migrated this database, which is the same day when the Blueprint creates both.
      - key: T21_PILOT_DB_CREATED
        sync: false
      # Optional: your user id (Account screen) if the operator is not the first account created on this server.
      - key: T21_ADMIN_USER_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: table21-db
          property: connectionString

databases:
  - name: table21-db
    plan: free
    region: frankfurt
    databaseName: table21
    user: table21
    ipAllowList: []
